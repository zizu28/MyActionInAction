name: "Zizu28 Action In Action"
description: 'Greets someone and returns 42 always'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  answer:
    description: 'The answer to everything (always 42).'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
  -  ${{ inputs.who-to-greet }}
